# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

# Nombre del workflow
name: Python application

# indica cuando tiene que ejecutarse este workflow
on:
  # Se ejecuta cuando hacen un push o un pull_request hacia la rama main
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Permisos: Le da al workflow permiso de lectura al contenido del repositorio
permissions:
  contents: read

jobs: # Define una tarea llamada test_and_build que se ejecutará en un entorno Ubuntu.
  test_and_build:
    # Toma una imagen de ubuntu para ejecutar el workflow
    runs-on: ubuntu-latest
    steps: # Pasos del workflow
      - uses: actions/checkout@v4 # Descarga el código del repositorio al entorno de GitHub Actions.
      - name: Set up Python 3.12
        uses: actions/setup-python@v3 # Instala Python 3.12 para que el proyecto pueda ejecutarse ahí
        with:
          python-version: "3.12"
          # Instalar dependencias del servicio analitico:
      - name: Install dependencies on ML service
        run:
          pip install -r ml_service/requirements.txt
          # Instalar dependencias del servicio de visualizacion:
      - name: Install dependencies on Dashboard
        run: pip install -r dashboards/requirements.txt
      # Valida que los Dockerfiles funcionan y que detecte errores de dependencia temprano
      - name: Build Docker images
        run: |
          docker build -t ml_service ./ml_service
          docker build -t dashboard ./dashboards
      # Valida que se hayan creado todos los modelos de clasificación y que exista el archivo de métricas
      - name: Validate classification training
        run: |
          python - <<'PY'
          import os
          import pickle
          required_files = [
            "models/modelo_arbol_decision.pkl",
            "models/modelo_regresion_logistica.pkl",
            "models/modelo_svm.pkl",
            "models/metricas_clasificacion_todas.json"
          ]
          missing = [f for f in required_files if not os.path.exists(f)]
          if missing:
            raise SystemExit(f"Faltan archivos de entrenamiento: {missing}")
          print("Entrenamiento de clasificación validado correctamente.")
          PY
      - name: Run classification training
        run: |
          python ml_service/train_clasificacion.py
          PY
        # Valida que se haya entrenado y guardado el modelo KMeans y que genere los resultados de salida
      - name: Validate segmentation training output
        run: |
          python - <<'PY'
          import os

          required_files = [
          "models/modelo_kmeans.pkl",
          "models/scaler.pkl",
          "models/pca.pkl",
          "models/metricas.json",
          "data/usuarios_segmentados.csv",
          "data/centroides.csv"
          ]

          missing = [f for f in required_files if not os.path.exista(f)]
          if missing:
            raise SystemExit(f"Faltan archivos de segmentación: {missing}")
          print("Entrenamiento de segmentación validado correctamente.")
          PY
      - name: Run segmentation training
        run: |
          python ml_service/train_segmentacion.py
